<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>my snowglobe</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header class ="hero">
            <h1>Rajasi's Globe of Snow</h1>
        <p>shake the globe, behold the results</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe", id="globe">
                    <img class="scene" src="snowglobe.png" alt="a snowglobe"/>
                </div>
                <button id="shake">BEHOLD</button>
                <p class="message" id="message">come see what settles</p>
            </section>
        </main>
        <footer>
            <p>made by me, on an airplane over colorado snow peaks</p>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
